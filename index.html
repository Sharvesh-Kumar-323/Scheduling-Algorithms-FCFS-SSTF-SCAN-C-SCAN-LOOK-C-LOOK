<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Scheduling Simulator</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Disk Scheduling Simulator</h1>
            <p>Simulate FCFS, SSTF, SCAN, C-SCAN, LOOK, and C-LOOK</p>
        </div>
    </header>

    <main class="container">
        <!-- Input Section -->
        <section class="card input-section">
            <h2>Configuration</h2>
            <form id="simulator-form">
                <div class="input-grid">
                    <div class="form-group full-width">
                        <label for="request-sequence">Request Sequence (Comma separated)</label>
                        <input type="text" id="request-sequence" value="" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="initial-head">Initial Head Position</label>
                        <input type="number" id="initial-head" value="" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="total-tracks">Total Tracks (Size)</label>
                        <input type="number" id="total-tracks" value="" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="direction">Direction</label>
                        <select id="direction">
                            <option value="towards-higher">Towards Highest (Up)</option>
                            <option value="towards-lower">Towards 0 (Down)</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="example-btn" class="btn btn-secondary">Load Example</button>
                    <button type="submit" class="btn btn-primary">Simulate Algorithms</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </section>

        <!-- Results Section -->
        <section class="results-section" id="results-section">
            <!-- Results will be dynamically injected here by JS -->
        </section>
    </main>

    <!-- App Logic -->
    <script src="script.js"></script>
</body>
</html>
